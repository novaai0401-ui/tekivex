name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 0. Lockfile integrity ─────────────────────────────────────────────────────
  # Mirrors exactly what the Render deploy does (pnpm install --frozen-lockfile on
  # Node 22). Fails the PR the moment package.json and pnpm-lock.yaml drift — e.g.
  # a dependency added to package.json without regenerating the pnpm lockfile —
  # instead of letting the mismatch surface as a broken deploy.
  lockfile:
    name: Lockfile in sync (pnpm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Verify pnpm-lock.yaml is in sync with package.json
        run: pnpm install --frozen-lockfile

  # ── 1. Typecheck ──────────────────────────────────────────────────────────────
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    needs: [lockfile]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

  # ── 2. Unit tests with coverage ───────────────────────────────────────────────
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    needs: [typecheck]
    strategy:
      fail-fast: false
      matrix:
        # Node 18 dropped: Vite 8 requires Node ^20.19 || >=22.12 and Vitest 4 drops Node 18.
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - run: npm ci

      - name: Run tests
        run: npm run test:run

      - name: Run tests with coverage + enforce thresholds
        if: matrix.node-version == 20
        run: npm run test:coverage -- --coverage.thresholds.lines=65 --coverage.thresholds.functions=60 --coverage.thresholds.branches=55

      - name: Upload coverage report
        if: matrix.node-version == 20
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

  # ── 3. Build ──────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      - name: Vite build
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

      - name: Check bundle size (JS < 2MB)
        run: |
          TOTAL=0
          for f in dist/assets/*.js; do
            [ -f "$f" ] && TOTAL=$((TOTAL + $(wc -c < "$f")))
          done
          MAX=$((2 * 1024 * 1024))
          echo "Total JS bundle: ${TOTAL} bytes (limit: ${MAX})"
          if [ "$TOTAL" -gt "$MAX" ]; then
            echo "::error::JS bundle exceeds 2MB"
            exit 1
          fi

  # ── 4. Security ───────────────────────────────────────────────────────────────
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      - name: Dependency audit (hard failure)
        run: npm audit --audit-level=high

      - name: License compliance check
        # Audit third-party dependency licenses only. --excludePrivatePackages skips
        # this repo's own private root package (license-checker reports any
        # "private": true package as UNLICENSED regardless of its license field).
        # MPL-2.0 is permitted for build-time-only deps (e.g. lightningcss, Vite's
        # native CSS transformer); its file-level copyleft imposes no obligations
        # on the distributed app.
        run: npx --yes license-checker --excludePrivatePackages --onlyAllow 'MIT;Apache-2.0;BSD-2-Clause;BSD-3-Clause;ISC;CC0-1.0;0BSD;Unlicense;Python-2.0;MPL-2.0'
