<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#334155"/></marker></defs><rect width="900" height="300" fill="#fff"/><text x="20" y="30" font-size="16" font-weight="700" fill="#0f172a">Two pages sharing one resource list</text><rect x="40" y="60" width="200" height="90" rx="8" fill="#f1f5f9" stroke="#334155"/><text x="140" y="85" text-anchor="middle" font-size="14" font-weight="600">Page 1 (kept)</text><text x="140" y="108" text-anchor="middle" font-size="12">draws: a line of text</text><text x="140" y="126" text-anchor="middle" font-size="12">never draws Im1</text><rect x="40" y="180" width="200" height="90" rx="8" fill="#fee2e2" stroke="#334155" stroke-dasharray="5 3"/><text x="140" y="205" text-anchor="middle" font-size="14" font-weight="600">Page 2 (deleted)</text><text x="140" y="228" text-anchor="middle" font-size="12">draws: image Im1</text><rect x="360" y="110" width="200" height="90" rx="8" fill="#e0e7ff" stroke="#334155"/><text x="460" y="140" text-anchor="middle" font-size="14" font-weight="600">Shared resource list</text><text x="460" y="163" text-anchor="middle" font-size="12">names Im1, fonts</text><rect x="680" y="125" width="180" height="60" rx="8" fill="#fde68a" stroke="#334155"/><text x="770" y="152" text-anchor="middle" font-size="14" font-weight="600">Image Im1</text><text x="770" y="172" text-anchor="middle" font-size="12">stored once</text><path d="M242 105 L356 155" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/><path d="M242 225 L356 155" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/><path d="M562 155 L676 155" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/><text x="20" y="292" font-size="12" fill="#334155">After page 2 is removed, page 1 still points to the list, which still names Im1, so a clean-up that drops unreferenced objects keeps it.</text></svg>