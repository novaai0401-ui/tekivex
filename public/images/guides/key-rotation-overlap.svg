<svg xmlns="http://www.w3.org/2000/svg" width="960" height="250" viewBox="0 0 960 250" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><rect width="960" height="250" fill="#ffffff"/><text x="20" y="30" font-size="16" font-weight="700" fill="#0f172a">Rotating a signing key without downtime</text><rect x="40" y="60" width="560" height="34" rx="6" fill="#fde68a" stroke="#334155"/><text x="50" y="82" font-size="13" fill="#0f172a">Old key: signs tokens</text><rect x="600" y="60" width="200" height="34" rx="6" fill="#fef3c7" stroke="#334155" stroke-dasharray="5 3"/><text x="610" y="82" font-size="13" fill="#0f172a">Old key: verify only</text><rect x="600" y="110" width="320" height="34" rx="6" fill="#bbf7d0" stroke="#334155"/><text x="610" y="132" font-size="13" fill="#0f172a">New key: signs and verifies</text><line x1="600" y1="50" x2="600" y2="160" stroke="#334155" stroke-width="2"/><text x="600" y="180" text-anchor="middle" font-size="12" fill="#334155">New key generated; issuer switches</text><line x1="800" y1="50" x2="800" y2="160" stroke="#334155" stroke-width="2"/><text x="800" y="180" text-anchor="middle" font-size="12" fill="#334155">Old key dropped</text><path d="M600 200 H800" stroke="#334155" stroke-width="1.5"/><text x="700" y="218" text-anchor="middle" font-size="12" fill="#334155">Overlap window ≥ longest token lifetime</text><text x="20" y="242" font-size="12" fill="#334155">Verifiers pick the key by the key ID each token carries. After a compromise the window is cut short on purpose.</text></svg>