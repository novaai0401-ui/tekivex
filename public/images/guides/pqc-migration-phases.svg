<svg xmlns="http://www.w3.org/2000/svg" width="960" height="230" viewBox="0 0 960 230" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#334155"/></marker></defs><rect width="960" height="230" fill="#ffffff"/><text x="20" y="30" font-size="16" font-weight="700" fill="#0f172a">Four-phase migration from classical JWTs to post-quantum tokens</text><rect x="20" y="50" width="215" height="100" rx="8" fill="#e2e8f0" stroke="#334155" stroke-width="1"/><text x="127.5" y="72" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">1. Inventory</text><text x="127.5" y="90" text-anchor="middle" font-size="13"  fill="#0f172a">Issue: classical only</text><text x="127.5" y="108" text-anchor="middle" font-size="13"  fill="#0f172a">Verify: classical only</text><text x="127.5" y="126" text-anchor="middle" font-size="13"  fill="#0f172a">Exit: all token paths listed</text><path d="M237 100 h12" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><rect x="255" y="50" width="215" height="100" rx="8" fill="#dbeafe" stroke="#334155" stroke-width="1"/><text x="362.5" y="72" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">2. Dual-issue</text><text x="362.5" y="90" text-anchor="middle" font-size="13"  fill="#0f172a">Issue: hybrid (both)</text><text x="362.5" y="108" text-anchor="middle" font-size="13"  fill="#0f172a">Verify: classical, PQ optional</text><text x="362.5" y="126" text-anchor="middle" font-size="13"  fill="#0f172a">Exit: all issuers hybrid</text><path d="M472 100 h12" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><rect x="490" y="50" width="215" height="100" rx="8" fill="#bfdbfe" stroke="#334155" stroke-width="1"/><text x="597.5" y="72" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">3. Verifier upgrade</text><text x="597.5" y="90" text-anchor="middle" font-size="13"  fill="#0f172a">Issue: hybrid</text><text x="597.5" y="108" text-anchor="middle" font-size="13"  fill="#0f172a">Verify: accept either</text><text x="597.5" y="126" text-anchor="middle" font-size="13"  fill="#0f172a">Exit: 100% verify PQ</text><path d="M707 100 h12" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><rect x="725" y="50" width="215" height="100" rx="8" fill="#bbf7d0" stroke="#334155" stroke-width="1"/><text x="832.5" y="72" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">4. Retire classical</text><text x="832.5" y="90" text-anchor="middle" font-size="13"  fill="#0f172a">Issue: PQ only</text><text x="832.5" y="108" text-anchor="middle" font-size="13"  fill="#0f172a">Verify: require PQ</text><text x="832.5" y="126" text-anchor="middle" font-size="13"  fill="#0f172a">Exit: no classical-only left</text><text x="20" y="185" font-size="13" fill="#334155">Do not advance until the exit criterion holds for every consumer. Phase 3 lasts at least as long as the longest-lived</text><text x="20" y="205" font-size="13" fill="#334155">classically signed token: the classical path can be retired only after the last one has expired.</text></svg>